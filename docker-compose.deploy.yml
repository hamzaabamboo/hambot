services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-ubuntu20.04-latest
    restart: always
  backend:
    image: registry.ham-san.net/hambot:latest
    restart: always
    ports:
      - 3000:3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - internal-services
    volumes:
      - './storage:/app/files'
      - './data:/app/data'
    env_file: '.env'
networks:
  internal-services:
    external: true
